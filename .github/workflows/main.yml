name: Android APK Keszites

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fajlok letoltese
        uses: actions/checkout@v4

      - name: Java beallitasa
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter telepitese
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Elektrik-Home App Kod Letrehozasa es Build
        run: |
          # 1. Tiszta keret generalasa
          flutter create . --project-name elektrik_home --org hu.elektrikhome
          
          # 2. A teljes, hibamentes villanyszerelo kod letrehozasa közvetlenül a szerveren
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'math_helper.dart' if (dart.library.html) 'math_helper.dart';
          import 'dart:math';

          void main() => runApp(VillanyszereloApp());

          class VillanyszereloApp extends StatelessWidget {
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Elektrik-Home Pro',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  primarySwatch: Colors.amber,
                  scaffoldBackgroundColor: Colors.grey[100],
                  appBarTheme: AppBarTheme(
                    backgroundColor: Colors.amber[700],
                    foregroundColor: Colors.black87,
                    elevation: 2,
                  ),
                ),
                home: MainMenuScreen(),
              );
            }
          }

          class MainMenuScreen extends StatelessWidget {
            @override
            Widget build(BuildContext context) {
              final List<MenuItemData> menuItems = [
                MenuItemData(
                  'Elméleti Alapok (1-6. fejezet)',
                  'Töltés, áram, Ohm és Kirchhoff törvényei, AC/DC',
                  Icons.menu_book,
                  Colors.indigo,
                  TheoryMenuScreen(),
                ),
                MenuItemData(
                  'Villanyszerelő Képletgyűjtemény',
                  'Minden fontos szakmai és méretezési képlet',
                  Icons.functions,
                  Colors.teal,
                  FormulasMenuScreen(),
                ),
                MenuItemData(
                  'Számológépek és Kalkulátorok',
                  'Áramerősség, keresztmetszet és feszültségesés',
                  Icons.calculate,
                  Colors.blue,
                  CalculatorsScreen(),
                ),
                MenuItemData(
                  'Kapcsolási Rajzok',
                  'Egypólusú, váltó, csillár kapcsolók',
                  Icons.electrical_services,
                  Colors.orange,
                  PlaceholderScreen(title: 'Kapcsolási Rajzok'),
                ),
                MenuItemData(
                  'Színkódok és Szabványok',
                  'Fázis, nulla, védővezető jelölések',
                  Icons.color_lens,
                  Colors.green,
                  PlaceholderScreen(title: 'Színkódok és Szabványok'),
                ),
                MenuItemData(
                  'Prémium Tartalom (Zárolt)',
                  'Exkluzív ipari projektek és méretezések',
                  Icons.lock,
                  Colors.red,
                  PlaceholderScreen(title: 'Prémium Tartalom'),
                ),
              ];

              return Scaffold(
                appBar: AppBar(
                  title: Text('Elektrik-Home Szakmai Segédlet', style: TextStyle(fontWeight: FontWeight.bold)),
                  centerTitle: true,
                ),
                body: Padding(
                  padding: EdgeInsets.all(12.0),
                  child: ListView.builder(
                    itemCount: menuItems.length,
                    itemBuilder: (context, index) {
                      final item = menuItems[index];
                      return Card(
                        elevation: 3,
                        margin: EdgeInsets.symmetric(vertical: 8),
                        shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                        child: ListTile(
                          contentPadding: EdgeInsets.symmetric(horizontal: 16, vertical: 8),
                          leading: CircleAvatar(
                            radius: 24,
                            backgroundColor: item.color.withOpacity(0.15),
                            child: Icon(item.icon, color: item.color, size: 28),
                          ),
                          title: Text(item.title, style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                          subtitle: Padding(
                            padding: EdgeInsets.only(top: 4.0),
                            child: Text(item.subtitle),
                          ),
                          trailing: Icon(Icons.arrow_forward_ios, size: 16, color: Colors.grey[600]),
                          onTap: () {
                            Navigator.push(
                              context,
                              MaterialPageRoute(builder: (context) => item.targetScreen),
                            );
                          },
                        ),
                      );
                    },
                  ),
                ),
              );
            }
          }

          class MenuItemData {
            final String title;
            final String subtitle;
            final IconData icon;
            final Color color;
            final Widget targetScreen;

            MenuItemData(this.title, this.subtitle, this.icon, this.color, this.targetScreen);
          }

          class TopicSection {
            final String title;
            final String subtitle;
            final List<String> bulletPoints;

            TopicSection(this.title, this.subtitle, this.bulletPoints);
          }

          class TheoryMenuScreen extends StatelessWidget {
            final List<TopicSection> chapters = [
              TopicSection(
                '1. fejezet: Alapfogalmak és az elektromos töltés',
                'Minden elektromos jelenség alapja a töltés, amely az anyag egy alapvető tulajdonsága.',
                [
                  'Elektromos töltés (Q): Jele Q, mértékegysége a Coulomb (C). Az elektronok negatív, a protonok pozitív töltésűek.',
                  'Elemi töltés: Egyetlen elektron töltése (e ≈ -1,6 · 10⁻¹⁹ C).',
                  'Coulomb-törvény: Két pontszerű töltés között ható erő egyenesen arányos a töltések nagyságával, és fordítottan arányos a köztük lévő távolság négyzetével.',
                  'Elektromos tér: A töltések maguk körül elektromos mezőt hoznak létre, amely erőt fejt ki a többi töltésre.',
                ],
              ),
              TopicSection(
                '2. fejezet: Elektromos áram, feszültség és ellenállás',
                'Ez a három alapvető mennyiség határozza meg a villamos áramkörök működését.',
                [
                  'Elektromos áram (I): A töltéshordozók egyirányú, rendezett mozgása.\\n• Képlete: I = Q / t\\n• Mértékegysége: Amper (A)',
                  'Elektromos feszültség (U): Két pont közötti potenciálkülönbség, amely az elektronokat mozgásra kényszeríti.\\n• Mértékegysége: Volt (V)',
                  'Elektromos ellenállás (R): Az anyagok azon tulajdonsága, amellyel akadályozzák az áram folyását.\\n• Képlete: R = ρ · (l / A)\\n• Mértékegysége: Ohm (Ω)',
                ],
              ),
              TopicSection(
                '3. fejezet: Alaptörvények az áramkörökben',
                'Az áramkörök méretezéséhez és megértéséhez szükséges legfontosabb szabályok.',
                [
                  'Ohm törvénye: Egy vezető szakaszán átfolyó áram erőssége egyenesen arányos a feszültséggel, és fordítottan az ellenállással.\\n• Képlete: I = U / R vagy U = I · R',
                  'Kirchhoff I. törvénye (Csomóponti törvény): Egy csomópontba befolyó áramok összege megegyezik az onnan kifolyó áramok összegével.',
                  'Kirchhoff II. törvénye (Huroktörvény): Bármely zárt áramköri hurokban a feszültségek előjeles összege nulla.',
                ],
              ),
              TopicSection(
                '4. fejezet: Ellenállások kapcsolása',
                'Az alkatrészeket két alapvető módon kombinálhatjuk:',
                [
                  'SOROS KAPCSOLÁS:\\n• Áram: Minden ellenálláson ugyanaz az áram folyik (I_össz = I₁ = I₂).\\n• Feszültség: A feszültségek összeadódnak.\\n• Eredő: R_eredő = R₁ + R₂ + ...',
                  'PÁRHUZAMOS KAPCSOLÁS:\\n• Áram: A részáramok összege adja a főág áramát.\\n• Feszültség: Minden ellenálláson ugyanakkora.\\n• Eredő: 1 / R_eredő = (1 / R₁) + (1 / R₂) + ...',
                ],
              ),
              TopicSection(
                '5. fejezet: Elektromos munka és teljesítmény',
                'Az elektromos áram energiát szállít a munkavégzéshez.',
                [
                  'Elektromos teljesítmény (P): Az egységnyi idő alatt végzett munka.\\n• Képlete: P = U · I\\n• Mértékegysége: Watt (W)',
                  'Elektromos munka (W): A teljesítmény és az idő szorzata.\\n• Képlete: W = P · t\\n• Mértékegysége: Joule (J) vagy Kilowatthóra (kWh).',
                ],
              ),
              TopicSection(
                '6. fejezet: Egyenáram (DC) vs. Váltakozó áram (AC)',
                'Az áram két fő típusa a gyakorlatban:',
                [
                  'Egyenáram (DC): Az áram és feszültség értéke az időben állandó (pl. akkumulátorok).',
                  'Váltakozó áram (AC): Az áram iránya és nagysága periodikusan változik (pl. konnektor).',
                  'Frekvencia (f): Európában 50 Hz (másodpercenként 50-szer vált irányt).',
                ],
              ),
            ];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text('Elméleti Alapok')),
                body: ListView.builder(
                  padding: EdgeInsets.all(12),
                  itemCount: chapters.length,
                  itemBuilder: (context, index) {
                    final ch = chapters[index];
                    return Card(
                      elevation: 2,
                      margin: EdgeInsets.symmetric(vertical: 6),
                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(10)),
                      child: ListTile(
                        leading: CircleAvatar(
                          backgroundColor: Colors.indigo.withOpacity(0.15),
                          child: Text('${index + 1}.', style: TextStyle(fontWeight: FontWeight.bold, color: Colors.indigo)),
                        ),
                        title: Text(ch.title, style: TextStyle(fontWeight: FontWeight.bold)),
                        subtitle: Text(ch.subtitle, maxLines: 2, overflow: TextOverflow.ellipsis),
                        trailing: Icon(Icons.arrow_forward_ios, size: 16),
                        onTap: () {
                          Navigator.push(
                            context,
                            MaterialPageRoute(builder: (context) => TopicDetailScreen(section: ch, themeColor: Colors.indigo)),
                          );
                        },
                      ),
                    );
                  },
                ),
              );
            }
          }

          class FormulasMenuScreen extends StatelessWidget {
            final List<TopicSection> formulaCategories = [
              TopicSection(
                '1. Alapvető egyenáramú és ohmikus képletek',
                'Tiszta ellenállásos körökben érvényes összefüggések.',
                [
                  'Ohm törvénye: U = I · R',
                  'Áramerősség: I = U / R',
                  'Ellenállás: R = U / I',
                  'Teljesítmény: P = U · I = I² · R = U² / R',
                  'Elektromos munka: W = P · t',
                ],
              ),
              TopicSection(
                '2. Vezetékek ellenállása és méretezése',
                'A vezeték anyaga, hossza és keresztmetszete határozza meg a veszteséget.',
                [
                  'Vezeték ellenállása: R = ρ · (l / A)',
                  'Fajlagos ellenállás (ρ): Réz = 0,0175 Ω·mm²/m, Alumínium = 0,028 Ω·mm²/m',
                  'Hossz (l): Egyfázisú körnél oda-vissza (2-szeres) távolsággal számolva!',
                  'Keresztmetszet: A = ρ · (l / R)',
                ],
              ),
              TopicSection(
                '3. Feszültségesés kiszámítása',
                'A feszültségesés mértéke a névleges feszültséghez képest max. 1-3% lehet.',
                [
                  'Egyfázisú (230V): ΔU = (2 · l · I · ρ) / A',
                  'Háromfázisú (400V): ΔU = (√3 · l · I · ρ · cosφ) / A',
                  'Százalékos esés: ε% = (ΔU / U_n) · 100',
                ],
              ),
              TopicSection(
                '4. Váltakozó áramú (AC) teljesítmények',
                'Induktív és kapacitív terhelések fáziseltolódással (cosφ).',
                [
                  'Látszólagos (S): S = U · I [VA]',
                  'Hatásos (P): P = U · I · cosφ [W]',
                  'Meddő (Q): Q = U · I · sinφ [var]',
                  'Teljesítménytényező: cosφ = P / S',
                ],
              ),
              TopicSection(
                '5. Háromfázisú hálózatok képletei',
                'Fázis- és vonali értékek aránya √3 ≈ 1,73.',
                [
                  'Háromfázisú hatásos teljesítmény: P = √3 · U_v · I · cosφ',
                  'Csillag (Y): I_v = I_f és U_v = √3 · U_f',
                  'Delta (Δ): U_v = U_f és I_v = √3 · I_f',
                ],
              ),
              TopicSection(
                '6. Ellenállások eredője',
                'Soros és párhuzamos kapcsolások.',
                [
                  'Soros: R_e = R₁ + R₂ + ...',
                  'Párhuzamos: 1 / R_e = (1 / R₁) + (1 / R₂) + ...',
                  'Két ellenállás esetén (Replusz): R_e = (R₁ · R₂) / (R₁ + R₂)',
                ],
              ),
              TopicSection(
                '7. Transzformátorok és motorok',
                'Áttételek, fordulatszám és hatásfok.',
                [
                  'Transzformátor áttétel: U₁ / U₂ = N₁ / N₂ = I₂ / I₁',
                  'Szinkron fordulatszám: n₀ = (f · 60) / p',
                  'Hatásfok (η): η = P_leadott / P_felvett',
                ],
              ),
            ];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text('Villanyszerelő Képletek')),
                body: ListView.builder(
                  padding: EdgeInsets.all(12),
                  itemCount: formulaCategories.length,
                  itemBuilder: (context, index) {
                    final cat = formulaCategories[index];
                    return Card(
                      elevation: 2,
                      margin: EdgeInsets.symmetric(vertical: 6),
                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(10)),
                      child: ListTile(
                        leading: CircleAvatar(
                          backgroundColor: Colors.teal.withOpacity(0.15),
                          child: Icon(Icons.functions, color: Colors.teal),
                        ),
                        title: Text(cat.title, style: TextStyle(fontWeight: FontWeight.bold)),
                        subtitle: Text(cat.subtitle, maxLines: 2, overflow: TextOverflow.ellipsis),
                        trailing: Icon(Icons.arrow_forward_ios, size: 16),
                        onTap: () {
                          Navigator.push(
                            context,
                            MaterialPageRoute(builder: (context) => TopicDetailScreen(section: cat, themeColor: Colors.teal)),
                          );
                        },
                      ),
                    );
                  },
                ),
              );
            }
          }

          class TopicDetailScreen extends StatelessWidget {
            final TopicSection section;
            final Color themeColor;

            TopicDetailScreen({required this.section, required this.themeColor});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text(section.title)),
                body: SingleChildScrollView(
                  padding: EdgeInsets.all(16.0),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Container(
                        width: double.infinity,
                        padding: EdgeInsets.all(14),
                        decoration: BoxDecoration(
                          color: themeColor.withOpacity(0.1),
                          borderRadius: BorderRadius.circular(10),
                          border: Border.all(color: themeColor.withOpacity(0.3)),
                        ),
                        child: Text(
                          section.subtitle,
                          style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.black87),
                        ),
                      ),
                      SizedBox(height: 16),
                      ...section.bulletPoints.map((point) => Card(
                        elevation: 1,
                        margin: EdgeInsets.symmetric(vertical: 6),
                        shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(8)),
                        child: Padding(
                          padding: EdgeInsets.all(14.0),
                          child: Row(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              Icon(Icons.bolt, color: themeColor, size: 22),
                              SizedBox(width: 10),
                              Expanded(
                                child: Text(
                                  point,
                                  style: TextStyle(fontSize: 15, height: 1.4),
                                ),
                              ),
                            ],
                          ),
                        ),
                      )).toList(),
                    ],
                  ),
                ),
              );
            }
          }

          class CalculatorsScreen extends StatefulWidget {
            @override
            _CalculatorsScreenState createState() => _CalculatorsScreenState();
          }

          class _CalculatorsScreenState extends State<CalculatorsScreen> {
            final TextEditingController powerController = TextEditingController();
            final TextEditingController voltageController = TextEditingController(text: '230');
            String currentResult = 'Add meg az adatokat a számításhoz!';

            final TextEditingController lengthController = TextEditingController();
            final TextEditingController ampController = TextEditingController();
            final TextEditingController crossSectionController = TextEditingController(text: '2.5');
            bool isThreePhase = false;
            bool isCopper = true;
            String dropResult = 'Add meg a vezeték adatait!';

            void calculateCurrent() {
              double? power = double.tryParse(powerController.text.replaceAll(',', '.'));
              double? voltage = double.tryParse(voltageController.text.replaceAll(',', '.'));

              if (power != null && voltage != null && voltage > 0) {
                double current = power / voltage;
                String wire = current <= 13 ? '1,5 mm²' : (current <= 20 ? '2,5 mm²' : (current <= 25 ? '4,0 mm²' : '6,0+ mm²'));
                setState(() {
                  currentResult = 'Szükséges áramerősség (I): ${current.toStringAsFixed(2)} A\\nAjánlott min. rézvezető: $wire';
                });
              } else {
                setState(() {
                  currentResult = 'Kérlek érvényes számokat adj meg!';
                });
              }
            }

            void calculateVoltageDrop() {
              double? l = double.tryParse(lengthController.text.replaceAll(',', '.'));
              double? i = double.tryParse(ampController.text.replaceAll(',', '.'));
              double? a = double.tryParse(crossSectionController.text.replaceAll(',', '.'));

              if (l != null && i != null && a != null && a > 0) {
                double rho = isCopper ? 0.0175 : 0.028;
                double un = isThreePhase ? 400.0 : 230.0;
                double deltaU = isThreePhase ? (sqrt(3) * l * i * rho) / a : (2 * l * i * rho) / a;
                double percent = (deltaU / un) * 100;

                setState(() {
                  dropResult = 'Feszültségesés (ΔU): ${deltaU.toStringAsFixed(2)} V\\nSzázalékos esés (ε%): ${percent.toStringAsFixed(2)} %\\n${percent <= 3.0 ? "✅ Megfelelő (< 3%)" : "⚠️ Túl magas feszültségesés (> 3%)!"}';
                });
              } else {
                setState(() {
                  dropResult = 'Kérlek minden mezőbe érvényes számot írj!';
                });
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text('Számológépek')),
                body: SingleChildScrollView(
                  padding: EdgeInsets.all(16.0),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text('1. Teljesítményből Áramerősség (I = P / U)', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.blue[900])),
                      SizedBox(height: 10),
                      TextField(controller: powerController, keyboardType: TextInputType.number, decoration: InputDecoration(labelText: 'Teljesítmény (Watt, pl. 3600)', border: OutlineInputBorder(), filled: true, fillColor: Colors.white)),
                      SizedBox(height: 10),
                      TextField(controller: voltageController, keyboardType: TextInputType.number, decoration: InputDecoration(labelText: 'Feszültség (Volt, pl. 230)', border: OutlineInputBorder(), filled: true, fillColor: Colors.white)),
                      SizedBox(height: 12),
                      ElevatedButton(
                        style: ElevatedButton.styleFrom(minimumSize: Size(double.infinity, 48), backgroundColor: Colors.blue[700], foregroundColor: Colors.white),
                        onPressed: calculateCurrent,
                        child: Text('Áramerősség Számolása', style: TextStyle(fontSize: 16)),
                      ),
                      SizedBox(height: 12),
                      Container(
                        padding: EdgeInsets.all(14),
                        width: double.infinity,
                        decoration: BoxDecoration(color: Colors.blue[50], borderRadius: BorderRadius.circular(10), border: Border.all(color: Colors.blue.shade200)),
                        child: Text(currentResult, style: TextStyle(fontSize: 15, fontWeight: FontWeight.bold, color: Colors.blue[900])),
                      ),
                      SizedBox(height: 30),
                      Divider(thickness: 2),
                      SizedBox(height: 15),
                      Text('2. Feszültségesés Kalkulátor (ΔU és ε%)', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.teal[900])),
                      SizedBox(height: 10),
                      Row(
                        children: [
                          Expanded(child: ChoiceChip(label: Text('1 Fázis (230V)'), selected: !isThreePhase, onSelected: (val) => setState(() => isThreePhase = false))),
                          SizedBox(width: 8),
                          Expanded(child: ChoiceChip(label: Text('3 Fázis (400V)'), selected: isThreePhase, onSelected: (val) => setState(() => isThreePhase = true))),
                        ],
                      ),
                      Row(
                        children: [
                          Expanded(child: ChoiceChip(label: Text('Réz (Cu)'), selected: isCopper, onSelected: (val) => setState(() => isCopper = true))),
                          SizedBox(width: 8),
                          Expanded(child: ChoiceChip(label: Text('Alumínium (Al)'), selected: !isCopper, onSelected: (val) => setState(() => isCopper = false))),
                        ],
                      ),
                      SizedBox(height: 10),
                      TextField(controller: lengthController, keyboardType: TextInputType.number, decoration: InputDecoration(labelText: 'Nyomvonal hossza (méter, pl. 25)', border: OutlineInputBorder(), filled: true, fillColor: Colors.white)),
                      SizedBox(height: 10),
                      TextField(controller: ampController, keyboardType: TextInputType.number, decoration: InputDecoration(labelText: 'Áramerősség (Amper, pl. 16)', border: OutlineInputBorder(), filled: true, fillColor: Colors.white)),
                      SizedBox(height: 10),
                      TextField(controller: crossSectionController, keyboardType: TextInputType.number, decoration: InputDecoration(labelText: 'Vezeték keresztmetszet (mm², pl. 2.5)', border: OutlineInputBorder(), filled: true, fillColor: Colors.white)),
                      SizedBox(height: 12),
                      ElevatedButton(
                        style: ElevatedButton.styleFrom(minimumSize: Size(double.infinity, 48), backgroundColor: Colors.teal[700], foregroundColor: Colors.white),
                        onPressed: calculateVoltageDrop,
                        child: Text('Feszültségesés Számolása', style: TextStyle(fontSize: 16)),
                      ),
                      SizedBox(height: 12),
                      Container(
                        padding: EdgeInsets.all(14),
                        width: double.infinity,
                        decoration: BoxDecoration(color: Colors.teal[50], borderRadius: BorderRadius.circular(10), border: Border.all(color: Colors.teal.shade200)),
                        child: Text(dropResult, style: TextStyle(fontSize: 15, fontWeight: FontWeight.bold, color: Colors.teal[900])),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class PlaceholderScreen extends StatelessWidget {
            final String title;
            PlaceholderScreen({required this.title});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text(title)),
                body: Padding(
                  padding: EdgeInsets.all(16.0),
                  child: Center(
                    child: Text(
                      'A(z) "$title" modul hamarosan feltöltésre kerül a saját anyagaiddal és képeiddel!',
                      textAlign: TextAlign.center,
                      style: TextStyle(fontSize: 17, color: Colors.grey[700]),
                    ),
                  ),
                ),
              );
            }
          }
          EOF

          # 3. Függőségek letöltése és build
          flutter pub get
          flutter build apk --release

      - name: Kész APK feltoltese
        uses: actions/upload-artifact@v4
        with:
          name: Elektrik-Home-Telepito
          path: build/app/outputs/flutter-apk/app-release.apk
