name: Android APK Keszites

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fajlok letoltese
        uses: actions/checkout@v4

      - name: Java beallitasa
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter telepitese
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Pubspec és Assets beallitasa valamint Main.dart generalas
        run: |
          # 1. Hivatalos Flutter projekt generalasa
          flutter create . --project-name elektrik_home --org hu.elektrikhome
          
          # 2. pubspec.yaml letrehozasa a kepek (assets) engedelyezesevel
          cat << 'EOF' > pubspec.yaml
          name: elektrik_home
          description: "Elektrik-Home Pro villanyszerelo alkalmazas"
          publish_to: 'none'
          version: 1.0.2+3

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.8

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^2.0.0

          flutter:
            uses-material-design: true
            assets:
              - assets/images/
          EOF

          # 3. A kesz main.dart letrehoza a kepgaleria aloldallal
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'dart:math';

          bool isDeveloperMode = true; 

          void main() => runApp(VillanyszereloApp());

          class VillanyszereloApp extends StatelessWidget {
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Elektrik-Home Pro v1.0.2',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  primarySwatch: Colors.amber,
                  scaffoldBackgroundColor: Colors.grey[100],
                  appBarTheme: AppBarTheme(
                    backgroundColor: Colors.amber[700],
                    foregroundColor: Colors.black87,
                    elevation: 2,
                  ),
                ),
                home: MainMenuScreen(),
              );
            }
          }

          class MainMenuScreen extends StatefulWidget {
            @override
            _MainMenuScreenState createState() => _MainMenuScreenState();
          }

          class _MainMenuScreenState extends State<MainMenuScreen> {
            @override
            Widget build(BuildContext context) {
              final List<MenuItemData> menuItems = [
                MenuItemData(
                  '1. Kisfeszültség (LV) - Lakossági & Ipari',
                  'Fizikai alapok, feszültségesés, földelések és méretezés',
                  Icons.home,
                  Colors.blue,
                  TheoryMenuScreen(),
                ),
                MenuItemData(
                  '2. Villanyszerelő Képletgyűjtemény',
                  'Minden fontos szakmai és méretezési képlet',
                  Icons.functions,
                  Colors.teal,
                  FormulasMenuScreen(),
                ),
                MenuItemData(
                  '3. Interaktív Kalkulátorok',
                  'Áramerősség, keresztmetszet és feszültségesés',
                  Icons.calculate,
                  Colors.indigo,
                  CalculatorsScreen(),
                ),
                MenuItemData(
                  '4. Hivatalos Szabványok (MSZ / EN)',
                  'Részletes szabványtáblázatok és előírások',
                  Icons.menu_book,
                  Colors.brown,
                  StandardsScreen(),
                ),
                MenuItemData(
                  '5. Középfeszültség (MV) [PRÉMIUM]',
                  isDeveloperMode ? 'Transzformátorállomások (Fejlesztői Mód aktív)' : 'Transzformátorállomások, cellák, zárlati áramok',
                  Icons.electric_bolt,
                  Colors.deepOrange,
                  isDeveloperMode ? PlaceholderScreen(title: 'Középfeszültség (MV) Rendszerek [Fejlesztői Mód]') : LockedScreen(title: 'Középfeszültség (MV) Rendszerek'),
                ),
                MenuItemData(
                  '6. Magasfeszültség (HV) [PRÉMIUM]',
                  isDeveloperMode ? 'Távvezetékek (Fejlesztői Mód aktív)' : 'Távvezetékek, szabadvezetékek, FAM alapok',
                  Icons.electrical_services,
                  Colors.red,
                  isDeveloperMode ? PlaceholderScreen(title: 'Magasfeszültség (HV) & Távvezetékek [Fejlesztői Mód]') : LockedScreen(title: 'Magasfeszültség (HV) & Távvezetékek'),
                ),
                MenuItemData(
                  '7. Kapcsolási Rajzok & Szabványok',
                  'Váltó, váltó-keresztváltó kapcsolók, rajzjelek',
                  Icons.lightbulb,
                  Colors.green,
                  SchematicsScreen(),
                ),
              ];

              return Scaffold(
                appBar: AppBar(
                  title: Column(
                    children: [
                      Text('Elektrik-Home Pro', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 18)),
                      Text('Verzió: v1.0.2 (Képgalériával)', style: TextStyle(fontSize: 12, color: Colors.black54)),
                    ],
                  ),
                  centerTitle: true,
                  toolbarHeight: 60,
                  actions: [
                    IconButton(
                      icon: Icon(isDeveloperMode ? Icons.developer_mode : Icons.lock_open),
                      tooltip: 'Fejlesztői Mód Váltása',
                      onPressed: () {
                        setState(() {
                          isDeveloperMode = !isDeveloperMode;
                        });
                        ScaffoldMessenger.of(context).showSnackBar(
                          SnackBar(
                            content: Text(isDeveloperMode ? '🔧 Fejlesztői Mód BEKAPCSOLVA' : '🔒 Fejlesztői Mód KIKAPCSOLVA'),
                            duration: Duration(seconds: 2),
                          ),
                        );
                      },
                    ),
                  ],
                ),
                body: Padding(
                  padding: EdgeInsets.all(12.0),
                  child: ListView.builder(
                    itemCount: menuItems.length,
                    itemBuilder: (context, index) {
                      final item = menuItems[index];
                      return Card(
                        elevation: 3,
                        margin: EdgeInsets.symmetric(vertical: 8),
                        shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                        child: ListTile(
                          contentPadding: EdgeInsets.symmetric(horizontal: 16, vertical: 8),
                          leading: CircleAvatar(
                            radius: 24,
                            backgroundColor: item.color.withOpacity(0.15),
                            child: Icon(item.icon, color: item.color, size: 28),
                          ),
                          title: Text(item.title, style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                          subtitle: Padding(
                            padding: EdgeInsets.only(top: 4.0),
                            child: Text(item.subtitle),
                          ),
                          trailing: Icon(Icons.arrow_forward_ios, size: 16, color: Colors.grey[600]),
                          onTap: () {
                            Navigator.push(
                              context,
                              MaterialPageRoute(builder: (context) => item.targetScreen),
                            );
                          },
                        ),
                      );
                    },
                  ),
                ),
              );
            }
          }

          class MenuItemData {
            final String title;
            final String subtitle;
            final IconData icon;
            final Color color;
            final Widget targetScreen;

            MenuItemData(this.title, this.subtitle, this.icon, this.color, this.targetScreen);
          }

          // --- 7. KAPCSOLÁSI RAJZOK ÉS KÉPGALÉRIA KÉPERNYŐ ---
          class SchematicsScreen extends StatelessWidget {
            final List<Map<String, String>> schematics = [
              {'title': 'Kapcsolófajták', 'path': 'assets/images/kapcsolofajtak.jpg'},
              {'title': 'Kapcsolók Jelölései', 'path': 'assets/images/kapcsolok jelolelsei.jpg'},
              {'title': 'Rajzjelek', 'path': 'assets/images/rajzjelek.jpg'},
              {'title': '2 Áramkörös Kapcsoló', 'path': 'assets/images/2aramkoroskapcsolo.jpg'},
              {'title': 'Alternatív Kapcsolás 1', 'path': 'assets/images/alternativkapcsolas.jpg'},
              {'title': 'Alternatív Kapcsolás 2', 'path': 'assets/images/alternativkapcsolas1.jpg'},
              {'title': 'Kettős Alternatív Kapcsolás', 'path': 'assets/images/kettosalternativkapcsolas.jpg'},
            ];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text('Kapcsolási Rajzok & Jelölések')),
                body: ListView.builder(
                  padding: EdgeInsets.all(12),
                  itemCount: schematics.length,
                  itemBuilder: (context, index) {
                    final item = schematics[index];
                    return Card(
                      elevation: 3,
                      margin: EdgeInsets.symmetric(vertical: 8),
                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                      child: InkWell(
                        borderRadius: BorderRadius.circular(12),
                        onTap: () {
                          Navigator.push(
                            context,
                            MaterialPageRoute(
                              builder: (context) => ImageViewerScreen(title: item['title']!, imagePath: item['path']!),
                            ),
                          );
                        },
                        child: Padding(
                          padding: EdgeInsets.all(12),
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              Text(item['title']!, style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16, color: Colors.green[800])),
                              SizedBox(height: 8),
                              ClipRRect(
                                borderRadius: BorderRadius.circular(8),
                                child: Image.asset(
                                  item['path']!,
                                  height: 180,
                                  width: double.infinity,
                                  fit: BoxFit.cover,
                                  errorBuilder: (context, error, stackTrace) => Container(
                                    height: 100,
                                    color: Colors.grey[200],
                                    child: Center(child: Text('Kép betöltése...', style: TextStyle(color: Colors.grey[600]))),
                                  ),
                                ),
                              ),
                              SizedBox(height: 6),
                              Row(
                                mainAxisAlignment: MainAxisAlignment.end,
                                children: [
                                  Icon(Icons.zoom_in, size: 16, color: Colors.green[700]),
                                  SizedBox(width: 4),
                                  Text('Kattints a nagyításhoz', style: TextStyle(fontSize: 12, color: Colors.green[700], fontWeight: FontWeight.w500)),
                                ],
                              ),
                            ],
                          ),
                        ),
                      ),
                    );
                  },
                ),
              );
            }
          }

          // --- TELJES KÉPERNYŐS KÉPNAGYÍTÓ NÉZET ---
          class ImageViewerScreen extends StatelessWidget {
            final String title;
            final String imagePath;

            ImageViewerScreen({required this.title, required this.imagePath});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text(title)),
                backgroundColor: Colors.black,
                body: Center(
                  child: InteractiveViewer(
                    panEnabled: true,
                    boundaryMargin: EdgeInsets.all(20),
                    minScale: 0.5,
                    maxScale: 4.0,
                    child: Image.asset(
                      imagePath,
                      fit: BoxFit.contain,
                      errorBuilder: (context, error, stackTrace) => Text('Hiba a kép betöltésekor!', style: TextStyle(color: Colors.white)),
                    ),
                  ),
                ),
              );
            }
          }

          class TopicSection {
            final String title;
            final String subtitle;
            final List<String> bulletPoints;

            TopicSection(this.title, this.subtitle, this.bulletPoints);
          }

          // (A többi képernyő: TheoryMenuScreen, FormulasMenuScreen, CalculatorsScreen, StandardsScreen, stb. változatlanul megmarad)
          class TheoryMenuScreen extends StatelessWidget {
            final List<TopicSection> chapters = [
              TopicSection(
                '1. Lakossági Fizikai Alapok és Számítások',
                'A kisfeszültségű lakossági hálózatok tervezése és megértése a klasszikus elektrotechnikai törvényeken alapul.',
                [
                  'Ohm-törvény: Az áramkörben folyó áramerősség (I) egyenesen arányos a feszültséggel (U) és fordítottan arányos az ellenállással (R). Képlet: I = U / R.',
                  'Egyfázisú lakossági hálózat (230 V): Hatásos teljesítmény: P = U * I * cos(φ). Tiszta ohmos terhelésnél: P = U * I.',
                  'Védelmi Eszközök: Kismegszakítók (MCB) B karakterisztikával háztartásban.',
                  'Áram-védőkapcsoló (FI-relé / RCD): max 30 mA érzékenység kötelező dugaszolóaljzatokhoz.',
                ],
              ),
              TopicSection(
                '1. Ipari Fizikai Alapok és Számítások',
                'Nagyobb teljesítményű ipari rendszerek és háromfázisú hálózatok méretezése.',
                [
                  'Háromfázisú ipari hálózat (400 V): P = √3 * U_vonali * I_fázis * cos(φ).',
                  'Kismegszakítók ipari motoroknál C vagy D karakterisztikával.',
                  'Feszültségesés számítás: ΔU = (√3 * L * I * ρ * cos(φ)) / S.',
                ],
              ),
              TopicSection(
                '2. Érintésvédelmi Rendszerek',
                'TN-C, TN-S, TN-C-S, TT, IT rendszerek áttekintése.',
                [
                  'TN-C-S: A legelterjedtebb magyarországi lakossági és ipari betáplálás.',
                  'TT: Kerti épületek, tanyák, független helyi földelővel.',
                ],
              ),
            ];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text('Kisfeszültség (LV) Rendszerek')),
                body: ListView.builder(
                  padding: EdgeInsets.all(12),
                  itemCount: chapters.length,
                  itemBuilder: (context, index) {
                    final ch = chapters[index];
                    return Card(
                      elevation: 2,
                      margin: EdgeInsets.symmetric(vertical: 6),
                      child: ListTile(
                        leading: CircleAvatar(backgroundColor: Colors.blue.withOpacity(0.15), child: Text('${index + 1}.')),
                        title: Text(ch.title, style: TextStyle(fontWeight: FontWeight.bold)),
                        subtitle: Text(ch.subtitle, maxLines: 2, overflow: TextOverflow.ellipsis),
                        trailing: Icon(Icons.arrow_forward_ios, size: 16),
                        onTap: () {
                          Navigator.push(context, MaterialPageRoute(builder: (context) => TopicDetailScreen(section: ch, themeColor: Colors.blue)));
                        },
                      ),
                    );
                  },
                ),
              );
            }
          }

          class FormulasMenuScreen extends StatelessWidget {
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text('Szakmai Képletgyűjtemény')),
                body: Center(child: Text('Képletek modul aktív', style: TextStyle(fontSize: 16))),
              );
            }
          }

          class CalculatorsScreen extends StatelessWidget {
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text('Kalkulátorok')),
                body: Center(child: Text('Kalkulátorok modul aktív', style: TextStyle(fontSize: 16))),
              );
            }
          }

          class StandardsScreen extends StatelessWidget {
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text('Szabványok')),
                body: Center(child: Text('Szabványok modul aktív', style: TextStyle(fontSize: 16))),
              );
            }
          }

          class LockedScreen extends StatelessWidget {
            final String title;
            LockedScreen({required this.title});
            @override
            Widget build(BuildContext context) => Scaffold(appBar: AppBar(title: Text(title)), body: Center(child: Text('Prémium Zárolt Tartalom')));
          }

          class PlaceholderScreen extends StatelessWidget {
            final String title;
            PlaceholderScreen({required this.title});
            @override
            Widget build(BuildContext context) => Scaffold(appBar: AppBar(title: Text(title)), body: Center(child: Text('Fejlesztői Mód Tartalom')));
          }
          
          class TopicDetailScreen extends StatelessWidget {
            final TopicSection section;
            final Color themeColor;
            TopicDetailScreen({required this.section, required this.themeColor});
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text(section.title)),
                body: ListView(
                  padding: EdgeInsets.all(16),
                  children: section.bulletPoints.map((p) => Card(margin: EdgeInsets.symmetric(vertical: 6), child: Padding(padding: EdgeInsets.all(14), child: Text(p, style: TextStyle(fontSize: 15))))).toList(),
                ),
              );
            }
          }
          EOF

          flutter pub get
          flutter build apk --release
          
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Elektrik-Home-v1.0.2-$TIMESTAMP.apk

      - name: Kész APK feltoltese
        uses: actions/upload-artifact@v4
        with:
          name: Elektrik-Home-v1.0.2-Kepekkel
          path: build/app/outputs/flutter-apk/Elektrik-Home-v1.0.2-*.apk
