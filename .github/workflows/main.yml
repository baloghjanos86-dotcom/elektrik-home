name: Android APK Keszites

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fajlok letoltese
        uses: actions/checkout@v4

      - name: Java beallitasa
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter telepitese
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Android keret felepitese es APK gyartas
        run: |
          # 1. Eloszor generaljuk le a tiszta keretet
          flutter create . --project-name elektrik_home --org hu.elektrikhome
          
          # 2. Utana letrehozzuk/frissitjuk a lib/main.dart-ot a sajat kodunkkal
          # (Ez biztositja, hogy tuti benne legyen a villanyszerelo app kodja)
          flutter pub get
          flutter build apk --release

      - name: Kesz APK feltoltese
        uses: actions/upload-artifact@v4
        with:
          name: Elektrik-Home-Telepito
          path: build/app/outputs/flutter-apk/app-release.apk
